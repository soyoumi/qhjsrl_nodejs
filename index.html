<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>强缓戒色日历</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0c1017;
            --bg-card: #141b24;
            --fg: #e8edf5;
            --muted: #5a6678;
            --accent: #00c896;
            --accent-glow: rgba(0, 200, 150, 0.25);
            --border: rgba(255, 255, 255, 0.06);
            --success: #00d68f;
            --neutral: #8a95a5;
            --danger: #ff6b6b;
            --warning: #ffa94d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 动态背景 */
        .bg-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .gradient-layer {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse 100% 60% at 50% -30%, rgba(0, 200, 150, 0.12), transparent 60%),
                radial-gradient(ellipse 80% 50% at 100% 50%, rgba(0, 150, 200, 0.08), transparent 50%),
                radial-gradient(ellipse 60% 40% at 0% 80%, rgba(100, 50, 200, 0.06), transparent 50%);
            animation: gradientShift 30s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        .grid-pattern {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black, transparent);
        }

        .particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 15s infinite;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }

        .main-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
            animation: fadeInDown 0.6s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.375rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--fg);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), #00a080);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .nav-actions {
            display: flex;
            gap: 0.625rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.625rem 1.125rem;
            border-radius: 10px;
            font-weight: 500;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--fg);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: opacity 0.25s;
        }

        .btn:hover::before { opacity: 1; }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .btn:active { transform: translateY(0); }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #00a080);
            border-color: transparent;
            color: #000;
            font-weight: 600;
        }

        .btn-primary:hover { box-shadow: 0 8px 30px var(--accent-glow); }

        .btn-danger { border-color: rgba(255, 107, 107, 0.3); }
        .btn-danger:hover {
            background: rgba(255, 107, 107, 0.1);
            border-color: var(--danger);
        }

        .calendar-wrapper { animation: fadeInUp 0.6s ease 0.1s backwards; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .month-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .nav-btn {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--fg);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-btn:hover {
            background: rgba(0, 200, 150, 0.1);
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .nav-btn:active { transform: scale(0.95); }

        .current-month {
            font-size: 1.625rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            min-width: 200px;
            text-align: center;
            background: linear-gradient(135deg, var(--fg) 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .calendar-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
            position: relative;
            overflow: hidden;
        }

        .calendar-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        }

        .weekday-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .weekday {
            text-align: center;
            font-size: 0.6875rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 0.5rem;
        }

        .weekday.weekend { color: var(--danger); opacity: 0.7; }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            font-weight: 500;
            font-size: 0.9375rem;
            background: transparent;
            border: 1px solid transparent;
            flex-direction: column;
        }

        .day-cell:not(.empty):hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border);
            transform: scale(1.08);
        }

        .day-cell.today {
            border-color: var(--accent);
            background: rgba(0, 200, 150, 0.08);
            box-shadow: 0 0 25px var(--accent-glow);
        }

        .day-cell.today::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 12px;
            padding: 1px;
            background: linear-gradient(135deg, var(--accent), transparent);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
        }

        .day-cell.weekend { color: var(--danger); opacity: 0.7; }
        .day-cell.other-month { color: var(--muted); opacity: 0.3; }
        .day-cell.empty { cursor: default; }
        .day-number { position: relative; z-index: 1; }

        .status-badge {
            position: absolute;
            bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: statusPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes statusPop {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .status-success { color: var(--success); }
        .status-neutral { color: var(--neutral); }
        .status-danger { color: var(--danger); }

        .stats-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
            margin-top: 1.25rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
        }

        .stat-item {
            text-align: center;
            padding: 0.875rem 0.5rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: all 0.25s ease;
        }

        .stat-item:hover {
            background: rgba(255, 255, 255, 0.04);
            transform: translateY(-2px);
        }

        .stat-icon { margin-bottom: 0.375rem; }
        .stat-value { font-size: 1.375rem; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
        .stat-label { font-size: 0.6875rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 0.25rem; }

        .year-view { display: none; }
        .year-view.active { display: block; }

        .month-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
        }

        .month-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1rem;
            transition: all 0.25s ease;
            animation: cardFadeIn 0.4s ease backwards;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .month-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .month-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .month-card-title {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--accent);
            letter-spacing: 0.02em;
        }

        .mini-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 2px;
            height: 168px;
            flex-shrink: 0;
        }

        .mini-day {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 2px;
            font-size: 0.625rem;
            border-radius: 4px;
            color: var(--muted);
            position: relative;
            min-height: 0;
        }

        .mini-day .day-num { line-height: 1; }
        .mini-day .mini-status-dot {
            position: absolute;
            bottom: 2px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .mini-day.status-success .mini-status-dot { background: var(--success); box-shadow: 0 0 6px var(--success); }
        .mini-day.status-neutral .mini-status-dot { background: var(--neutral); }
        .mini-day.status-danger .mini-status-dot { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

        .month-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.375rem;
            margin-top: auto;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .month-stat {
            text-align: center;
            padding: 0.375rem 0.25rem;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.02);
        }

        .month-stat-value { font-size: 0.875rem; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
        .month-stat-label { font-size: 0.5625rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.125rem; }

        .year-stats {
            margin-top: 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.25rem;
            animation: fadeInUp 0.5s ease 0.3s backwards;
        }

        .year-stats-title {
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .year-stats-title::before, .year-stats-title::after {
            content: '';
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border));
        }

        .year-stats-title::after { background: linear-gradient(90deg, var(--border), transparent); }

        .year-stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
        }

        .year-stat-item {
            text-align: center;
            padding: 1rem 0.5rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: all 0.25s ease;
        }

        .year-stat-item:hover {
            background: rgba(255, 255, 255, 0.04);
            transform: translateY(-2px);
        }

        .year-stat-icon { margin-bottom: 0.5rem; }
        .year-stat-value { font-size: 1.75rem; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
        .year-stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 0.25rem; }

        /* Modal & Toast & Responsive - Same as before, trimmed for brevity in thinking but included in output */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; visibility: hidden; transition: all 0.35s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 2rem; width: 90%; max-width: 380px; transform: scale(0.85) translateY(30px); transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); position: relative; overflow: hidden; }
        .modal::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent); }
        .modal-overlay.active .modal { transform: scale(1) translateY(0); }
        .modal-icon { width: 64px; height: 64px; margin: 0 auto 1.25rem; background: linear-gradient(135deg, rgba(0, 200, 150, 0.15), rgba(0, 200, 150, 0.05)); border-radius: 16px; display: flex; align-items: center; justify-content: center; color: var(--accent); }
        .modal-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; text-align: center; }
        .modal-subtitle { font-size: 0.8125rem; color: var(--muted); text-align: center; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1.25rem; }
        .input { width: 100%; padding: 0.875rem 1rem; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; color: var(--fg); font-size: 1rem; transition: all 0.25s ease; text-align: center; letter-spacing: 0.2em; }
        .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .input::placeholder { color: var(--muted); letter-spacing: normal; }
        .error-msg { color: var(--danger); font-size: 0.8125rem; margin-top: 0.5rem; text-align: center; display: none; }
        .error-msg.show { display: block; animation: shake 0.5s ease; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
        .modal-actions { display: flex; gap: 0.75rem; }
        .modal-actions .btn { flex: 1; padding: 0.875rem; }

        .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--bg-card); border: 1px solid var(--border); padding: 0.875rem 1.5rem; border-radius: 12px; font-size: 0.875rem; z-index: 200; opacity: 0; transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); display: flex; align-items: center; gap: 0.625rem; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast-icon { color: var(--success); }
        .toast-icon.error { color: var(--danger); }

        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .main-container { padding: 1rem; }
            .header { flex-direction: column; gap: 1rem; }
            .nav-actions { width: 100%; justify-content: center; flex-wrap: wrap; }
            .current-month { font-size: 1.25rem; min-width: auto; }
            .stats-panel { grid-template-columns: repeat(2, 1fr); }
            .calendar-card { padding: 1rem; }
            .day-cell { font-size: 0.8125rem; border-radius: 10px; }
            .month-nav { gap: 1rem; }
            .nav-btn { width: 44px; height: 44px; }
            .year-stats-grid { grid-template-columns: repeat(2, 1fr); }
            .month-stats { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 480px) {
            .stats-panel { grid-template-columns: 1fr 1fr; }
            .stat-item { padding: 0.75rem 0.25rem; }
            .stat-value { font-size: 1.125rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        #importInput { display: none; }
    </style>
</head>
<body>
    <div class="bg-canvas">
        <div class="gradient-layer"></div>
        <div class="grid-pattern"></div>
        <div class="particles" id="particles"></div>
    </div>

    <div class="main-container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                </div>
                强缓戒色日历
            </div>
            <div class="nav-actions">
                <button class="btn" id="viewToggle">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    全年视图
                </button>
                
                <button class="btn hidden" id="exportBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    导出
                </button>
                <button class="btn hidden" id="importBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    导入
                </button>
                <button class="btn btn-danger hidden" id="logoutBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    退出
                </button>
                
                <button class="btn btn-primary" id="loginBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                    登录
                </button>
            </div>
        </header>

        <div class="calendar-wrapper" id="monthView">
            <div class="month-nav">
                <button class="nav-btn" id="prevMonth" aria-label="上个月">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <div class="current-month" id="currentMonthLabel"></div>
                <button class="nav-btn" id="nextMonth" aria-label="下个月">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
                </button>
            </div>

            <div class="calendar-card">
                <div class="weekday-row">
                    <div class="weekday weekend">日</div><div class="weekday">一</div><div class="weekday">二</div><div class="weekday">三</div><div class="weekday">四</div><div class="weekday">五</div><div class="weekday weekend">六</div>
                </div>
                <div class="days-grid" id="daysGrid"></div>
                <div class="stats-panel">
                    <div class="stat-item"><div class="stat-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg></div><div class="stat-value" style="color: var(--success)" id="successCount">0</div><div class="stat-label">优秀</div></div>
                    <div class="stat-item"><div class="stat-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--neutral)" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg></div><div class="stat-value" style="color: var(--neutral)" id="neutralCount">0</div><div class="stat-label">缓戒</div></div>
                    <div class="stat-item"><div class="stat-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg></div><div class="stat-value" style="color: var(--danger)" id="dangerCount">0</div><div class="stat-label">不良</div></div>
                    <div class="stat-item"><div class="stat-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--warning)" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg></div><div class="stat-value" style="color: var(--warning)" id="streakCount">0</div><div class="stat-label">连续</div></div>
                </div>
            </div>
        </div>

        <div class="year-view" id="yearView">
            <div class="month-nav">
                <button class="nav-btn" id="prevYear" aria-label="上一年"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>
                <div class="current-month" id="currentYearLabel"></div>
                <button class="nav-btn" id="nextYear" aria-label="下一年"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg></button>
            </div>
            <div class="month-grid" id="yearGrid"></div>
            
            <div class="year-stats">
                <div class="year-stats-title">全年统计</div>
                <div class="year-stats-grid">
                    <div class="year-stat-item"><div class="year-stat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg></div><div class="year-stat-value" style="color: var(--success)" id="yearSuccessCount">0</div><div class="year-stat-label">优秀</div></div>
                    <div class="year-stat-item"><div class="year-stat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--neutral)" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg></div><div class="year-stat-value" style="color: var(--neutral)" id="yearNeutralCount">0</div><div class="year-stat-label">缓戒</div></div>
                    <div class="year-stat-item"><div class="year-stat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg></div><div class="year-stat-value" style="color: var(--danger)" id="yearDangerCount">0</div><div class="year-stat-label">不良</div></div>
                    <div class="year-stat-item"><div class="year-stat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--warning)" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg></div><div class="year-stat-value" style="color: var(--warning)" id="yearStreakCount">0</div><div class="year-stat-label">连续</div></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal" role="dialog" aria-modal="true">
            <div class="modal-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
            <h2 class="modal-title">身份验证</h2>
            <p class="modal-subtitle">请输入登录码以继续操作</p>
            <div class="input-group">
                <input type="password" class="input" id="loginCodeInput" placeholder="输入登录码" autocomplete="off" maxlength="10">
                <p class="error-msg" id="loginErrorMsg">登录码错误，请重试</p>
            </div>
            <div class="modal-actions">
                <button class="btn" id="loginCancelBtn">取消</button>
                <button class="btn btn-primary" id="loginConfirmBtn">确认登录</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <svg class="toast-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
        <span id="toastText"></span>
    </div>

    <input type="file" id="importInput" accept=".json">

    <script>
        const state = { currentYear: new Date().getFullYear(), currentMonth: new Date().getMonth(), viewMode: 'month', isLoggedIn: false, pendingAction: null, records: {} };
        const DOM = {
            monthView: document.getElementById('monthView'), yearView: document.getElementById('yearView'), daysGrid: document.getElementById('daysGrid'),
            currentMonthLabel: document.getElementById('currentMonthLabel'), currentYearLabel: document.getElementById('currentYearLabel'), yearGrid: document.getElementById('yearGrid'),
            loginModal: document.getElementById('loginModal'), loginCodeInput: document.getElementById('loginCodeInput'), loginErrorMsg: document.getElementById('loginErrorMsg'),
            successCount: document.getElementById('successCount'), neutralCount: document.getElementById('neutralCount'), dangerCount: document.getElementById('dangerCount'), streakCount: document.getElementById('streakCount'),
            yearSuccessCount: document.getElementById('yearSuccessCount'), yearNeutralCount: document.getElementById('yearNeutralCount'), yearDangerCount: document.getElementById('yearDangerCount'), yearStreakCount: document.getElementById('yearStreakCount'),
            toast: document.getElementById('toast'), toastText: document.getElementById('toastText'), toastIcon: document.querySelector('.toast-icon'),
            viewToggle: document.getElementById('viewToggle'), particles: document.getElementById('particles'),
            loginBtn: document.getElementById('loginBtn'), logoutBtn: document.getElementById('logoutBtn'), exportBtn: document.getElementById('exportBtn'), importBtn: document.getElementById('importBtn'), importInput: document.getElementById('importInput')
        };

        const getMonthDays = (y, m) => new Date(y, m + 1, 0).getDate();
        const getFirstDayOfMonth = (y, m) => new Date(y, m, 1).getDay();
        const formatDateKey = (y, m, d) => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const showToast = (msg, isErr = false) => { DOM.toastText.textContent = msg; DOM.toastIcon.classList.toggle('error', isErr); DOM.toast.classList.add('show'); setTimeout(() => DOM.toast.classList.remove('show'), 3000); };
        
        const loadRecords = async () => { 
            try { 
                const res = await fetch('/api/records');
                const data = await res.json();
                if (data.success) {
                    state.records = data.records || {};
                }
            } catch (e) { 
                state.records = {}; 
            } 
        };
        const saveRecord = async (date, status) => {
            try {
                const res = await fetch('/api/records', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date, status })
                });
                const data = await res.json();
                return data.success;
            } catch (e) {
                return false;
            }
        };
        const checkAuth = async () => { 
            try {
                const res = await fetch('/api/auth');
                const data = await res.json();
                if (data.success) {
                    state.isLoggedIn = data.isLoggedIn;
                }
            } catch (e) {
                state.isLoggedIn = false;
            }
            updateAuthUI(); 
        };
        const setAuth = async (auth) => { 
            state.isLoggedIn = auth; 
            if (auth) {
                await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: DOM.loginCodeInput.value.trim() })
                });
            } else {
                await fetch('/api/auth/logout', { method: 'POST' });
            }
            updateAuthUI(); 
        };
        const updateAuthUI = () => { [DOM.loginBtn, DOM.logoutBtn, DOM.exportBtn, DOM.importBtn].forEach(el => el && el.classList.toggle('hidden', state.isLoggedIn ? (el === DOM.loginBtn) : (el !== DOM.loginBtn))); };
        
        const showLoginModal = () => { DOM.loginModal.classList.add('active'); DOM.loginCodeInput.value = ''; DOM.loginErrorMsg.classList.remove('show'); setTimeout(() => DOM.loginCodeInput.focus(), 100); };
        const hideLoginModal = () => { DOM.loginModal.classList.remove('active'); state.pendingAction = null; };
        const handleLogin = async () => { 
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: DOM.loginCodeInput.value.trim() })
                });
                const data = await res.json();
                if (data.success) {
                    state.isLoggedIn = true;
                    updateAuthUI();
                    hideLoginModal();
                    showToast('登录成功');
                    if (state.pendingAction) {
                        toggleDayStatus(state.pendingAction.day);
                        state.pendingAction = null;
                    }
                } else {
                    DOM.loginErrorMsg.classList.add('show');
                    DOM.loginCodeInput.value = '';
                    DOM.loginCodeInput.focus();
                }
            } catch (err) {
                DOM.loginErrorMsg.classList.add('show');
                DOM.loginCodeInput.value = '';
                DOM.loginCodeInput.focus();
            }
        };
        
        const exportData = () => { const blob = new Blob([JSON.stringify({ version: '1.0', exportTime: new Date().toISOString(), records: state.records }, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `强缓戒色日历_${new Date().toISOString().split('T')[0]}.json`; a.click(); URL.revokeObjectURL(a.href); showToast('数据导出成功'); };
        const importData = async (file) => { 
            const reader = new FileReader(); 
            reader.onload = async (e) => { 
                try { 
                    const data = JSON.parse(e.target.result); 
                    if (!data.records) throw new Error('无效格式'); 
                    const confirmed = confirm('确定合并数据？取消则替换');
                    const res = await fetch('/api/import', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ records: data.records, merge: confirmed })
                    });
                    const result = await res.json();
                    if (result.success) {
                        await loadRecords();
                        renderCalendar();
                        if (state.viewMode === 'year') renderYearView();
                        showToast('导入成功');
                    } else {
                        showToast('导入失败：' + result.error, true);
                    }
                } catch (err) { 
                    showToast('导入失败：' + err.message, true); 
                } 
            }; 
            reader.readAsText(file); 
        };

        const getMonthStats = (y, m) => { let s = 0, n = 0, d = 0; for (let i = 1; i <= getMonthDays(y, m); i++) { const st = state.records[formatDateKey(y, m, i)]; if (st === 'success') s++; else if (st === 'neutral') n++; else if (st === 'danger') d++; } return { success: s, neutral: n, danger: d }; };
        const getYearStats = (y) => { let s = 0, n = 0, d = 0; for (let m = 0; m < 12; m++) { const ms = getMonthStats(y, m); s += ms.success; n += ms.neutral; d += ms.danger; } return { success: s, neutral: n, danger: d }; };
        
        const createStatusBadge = (status) => { const badge = document.createElement('span'); badge.className = `status-badge status-${status}`; const icons = { success: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>', neutral: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>', danger: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg>' }; badge.innerHTML = icons[status] || ''; return badge; };
        const calculateStreak = () => { const today = new Date(); let streak = 0; let curr = new Date(today); while (true) { if (state.records[formatDateKey(curr.getFullYear(), curr.getMonth(), curr.getDate())] === 'success') { streak++; curr.setDate(curr.getDate() - 1); } else break; } return streak; };
        
        const renderCalendar = () => { const y = state.currentYear, m = state.currentMonth, days = getMonthDays(y, m), first = getFirstDayOfMonth(y, m), today = new Date(); const names = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月']; DOM.currentMonthLabel.textContent = `${y}年 ${names[m]}`; DOM.daysGrid.innerHTML = ''; for (let i = 0; i < first; i++) DOM.daysGrid.appendChild(Object.assign(document.createElement('div'), { className: 'day-cell empty' })); for (let d = 1; d <= days; d++) { const cell = document.createElement('div'); cell.className = 'day-cell'; cell.dataset.day = d; const dow = new Date(y, m, d).getDay(); if (dow === 0 || dow === 6) cell.classList.add('weekend'); if (y === today.getFullYear() && m === today.getMonth() && d === today.getDate()) cell.classList.add('today'); const key = formatDateKey(y, m, d); const status = state.records[key]; const num = document.createElement('span'); num.className = 'day-number'; num.textContent = d; cell.appendChild(num); if (status) cell.appendChild(createStatusBadge(status)); cell.addEventListener('click', () => handleDayClick(d)); DOM.daysGrid.appendChild(cell); } updateStats(); };
        const updateStats = () => { const s = getMonthStats(state.currentYear, state.currentMonth); DOM.successCount.textContent = s.success; DOM.neutralCount.textContent = s.neutral; DOM.dangerCount.textContent = s.danger; DOM.streakCount.textContent = calculateStreak(); };
        
        const handleDayClick = (day) => { if (!state.isLoggedIn) { state.pendingAction = { day }; showLoginModal(); return; } toggleDayStatus(day); };
        const toggleDayStatus = async (day) => { 
            const key = formatDateKey(state.currentYear, state.currentMonth, day); 
            const curr = state.records[key]; 
            const order = ['success', 'neutral', 'danger']; 
            let next = null; 
            if (!curr) next = 'success'; 
            else { 
                const idx = order.indexOf(curr); 
                if (idx === -1) next = 'success'; 
                else if (idx < 2) next = order[idx + 1]; 
                else next = null; 
            } 
            if (next) state.records[key] = next; 
            else delete state.records[key]; 
            await saveRecord(key, next); 
            renderCalendar(); 
        };
        
        const renderYearView = () => { const y = state.currentYear; DOM.currentYearLabel.textContent = `${y}年`; DOM.yearGrid.innerHTML = ''; const names = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月']; for (let m = 0; m < 12; m++) { const card = document.createElement('div'); card.className = 'month-card'; card.style.animationDelay = `${m * 0.04}s`; const header = document.createElement('div'); header.className = 'month-card-header'; const title = document.createElement('div'); title.className = 'month-card-title'; title.textContent = names[m]; header.appendChild(title); card.appendChild(header); const grid = document.createElement('div'); grid.className = 'mini-grid'; const days = getMonthDays(y, m), first = getFirstDayOfMonth(y, m); for (let i = 0; i < 42; i++) { const dayEl = document.createElement('div'); dayEl.className = 'mini-day'; const d = i - first + 1; if (i >= first && d <= days) { const num = document.createElement('span'); num.className = 'day-num'; num.textContent = d; dayEl.appendChild(num); const st = state.records[formatDateKey(y, m, d)]; if (st) { dayEl.classList.add('status-' + st); const dot = document.createElement('span'); dot.className = 'mini-status-dot'; dayEl.appendChild(dot); } } grid.appendChild(dayEl); } card.appendChild(grid); const ms = getMonthStats(y, m); const statsDiv = document.createElement('div'); statsDiv.className = 'month-stats'; statsDiv.innerHTML = `<div class="month-stat"><div class="month-stat-value" style="color: var(--success)">${ms.success}</div><div class="month-stat-label">优秀</div></div><div class="month-stat"><div class="month-stat-value" style="color: var(--neutral)">${ms.neutral}</div><div class="month-stat-label">缓戒</div></div><div class="month-stat"><div class="month-stat-value" style="color: var(--danger)">${ms.danger}</div><div class="month-stat-label">不良</div></div><div class="month-stat"><div class="month-stat-value" style="color: var(--warning)">-</div><div class="month-stat-label">连续</div></div>`; card.appendChild(statsDiv); card.addEventListener('click', () => { state.currentMonth = m; switchToMonthView(); }); DOM.yearGrid.appendChild(card); } updateYearStats(); };
        const updateYearStats = () => { const s = getYearStats(state.currentYear); DOM.yearSuccessCount.textContent = s.success; DOM.yearNeutralCount.textContent = s.neutral; DOM.yearDangerCount.textContent = s.danger; DOM.yearStreakCount.textContent = calculateStreak(); };

        const switchToYearView = () => { state.viewMode = 'year'; DOM.monthView.classList.add('hidden'); DOM.yearView.classList.add('active'); DOM.viewToggle.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>月视图'; renderYearView(); };
        const switchToMonthView = () => { state.viewMode = 'month'; DOM.monthView.classList.remove('hidden'); DOM.yearView.classList.remove('active'); DOM.viewToggle.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>全年视图'; renderCalendar(); };
        
        const createParticles = () => { for (let i = 0; i < 15; i++) { const p = document.createElement('div'); p.className = 'particle'; p.style.left = Math.random() * 100 + '%'; p.style.animationDelay = Math.random() * 15 + 's'; p.style.animationDuration = (15 + Math.random() * 10) + 's'; DOM.particles.appendChild(p); } };

        const bindEvents = () => {
            document.getElementById('prevMonth').addEventListener('click', () => { state.currentMonth--; if (state.currentMonth < 0) { state.currentMonth = 11; state.currentYear--; } renderCalendar(); });
            document.getElementById('nextMonth').addEventListener('click', () => { state.currentMonth++; if (state.currentMonth > 11) { state.currentMonth = 0; state.currentYear++; } renderCalendar(); });
            document.getElementById('prevYear').addEventListener('click', () => { state.currentYear--; renderYearView(); });
            document.getElementById('nextYear').addEventListener('click', () => { state.currentYear++; renderYearView(); });
            DOM.viewToggle.addEventListener('click', () => { state.viewMode === 'month' ? switchToYearView() : switchToMonthView(); });
            DOM.loginBtn.addEventListener('click', showLoginModal);
            document.getElementById('loginCancelBtn').addEventListener('click', hideLoginModal);
            document.getElementById('loginConfirmBtn').addEventListener('click', handleLogin);
            DOM.loginCodeInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
            DOM.loginModal.addEventListener('click', e => { if (e.target === DOM.loginModal) hideLoginModal(); });
            DOM.logoutBtn.addEventListener('click', async () => { await setAuth(false); showToast('已退出登录'); });
            DOM.exportBtn.addEventListener('click', exportData);
            DOM.importBtn.addEventListener('click', () => DOM.importInput.click());
            DOM.importInput.addEventListener('change', e => { if (e.target.files[0]) { importData(e.target.files[0]); e.target.value = ''; } });
            document.addEventListener('keydown', e => { if (DOM.loginModal.classList.contains('active')) return; if (state.viewMode === 'month') { if (e.key === 'ArrowLeft') document.getElementById('prevMonth').click(); if (e.key === 'ArrowRight') document.getElementById('nextMonth').click(); } else { if (e.key === 'ArrowLeft') document.getElementById('prevYear').click(); if (e.key === 'ArrowRight') document.getElementById('nextYear').click(); } });
        };

        (async () => { await loadRecords(); await checkAuth(); createParticles(); bindEvents(); renderCalendar(); })();
    </script>
</body>
</html>
